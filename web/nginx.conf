limit_req_zone $binary_remote_addr zone=api:10m rate=15r/s;
server {
  listen 80;
  server_tokens off;
  client_max_body_size 50m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; img-src 'self' blob: data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://server:8080;
    proxy_read_timeout 40s;
    proxy_set_header Host $host;
  }
  location /ws {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
}
